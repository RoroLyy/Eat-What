  <style>

:root{--paper:#f8f7f3;--white:#fff;--green:#526a42;--green-dark:#344a2c;--green-soft:#eef2e8;--ink:#30372d;--muted:#8a8e83;--line:#e7e7de;--peach:#fcf0e5;--serif:'Noto Serif SC','Songti SC',SimSun,serif;--sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}
button,a,input,select{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button{border:0;background:none;color:inherit}
button,a,input,select{outline-offset:4px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--green)}
a{color:inherit;text-decoration:none}
button:disabled{cursor:default;opacity:.5}
svg{width:18px;height:18px;flex:none;stroke-width:1.7;vertical-align:middle}
[data-icon]{display:inline-flex;align-items:center;justify-content:center;flex:none}
button svg{pointer-events:none}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:228px;background:#fffefa;border-right:1px solid var(--line);padding:37px 20px 21px;display:flex;flex-direction:column;z-index:20}
.brand{display:flex;align-items:center;gap:11px;padding:0 5px}
.brand-mark{width:43px;height:43px;background:var(--green);border-radius:14px;display:grid;place-items:center;color:#fffbed}
.brand-mark svg{width:29px;height:29px}
.brand strong{display:block;font-family:var(--serif);font-size:20px;letter-spacing:1px;line-height:1.5}
.brand small{display:block;font-size:10px;letter-spacing:1.1px;color:var(--muted);margin-top:3px}
.nav-caption{margin:48px 13px 14px;color:#a0a395;font-size:10px;letter-spacing:2px}
nav{display:grid;gap:7px}
.nav-item{height:49px;width:100%;display:flex;align-items:center;gap:13px;padding:0 15px;border-radius:7px;text-align:left;font-size:14px;color:#737b6b;transition:background .2s,color .2s}
.nav-item>span:first-child{color:#89927e}
.nav-item:hover{background:#f4f5ee;color:var(--green)}
.nav-item.active{background:var(--green-soft);color:var(--green);font-weight:600}
.nav-item.active>span:first-child{color:var(--green)}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--green);margin-left:auto}
.nav-item:not(.active) .nav-dot{display:none}
.nav-count{margin-left:auto;font-size:10px;min-width:21px;height:20px;line-height:20px;text-align:center;background:#f0f1eb;color:#78846e;border-radius:5px;font-weight:500}
.sidebar-note{position:relative;margin:46px 5px 20px;padding:22px 20px 35px;min-height:192px;background:#f2f3ea;border-radius:8px;overflow:hidden}
.note-leaf{color:#7e9268;margin-bottom:8px}
.note-leaf svg{width:27px;height:27px;stroke-width:1.25}
.sidebar-note p{font-family:var(--serif);font-size:16px;line-height:1.9;margin:4px 0 10px;color:#69745b;letter-spacing:1px}
.sidebar-note small{color:#9bA08e;font-size:10px;letter-spacing:.5px}
.note-lines{position:absolute;right:-13px;bottom:-35px;width:90px;height:120px;border:1px solid #d8dfc9;border-radius:100% 0;transform:rotate(-23deg)}
.note-lines:before,.note-lines:after{content:'';position:absolute;width:65px;height:104px;right:13px;bottom:6px;border:1px solid #d8dfc9;border-radius:100% 0}
.note-lines:after{width:40px;right:26px}
.sidebar-bottom{margin-top:auto;padding-top:23px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.avatar{display:grid;place-items:center;flex:none;background:#edece0;color:#87926f;font-family:var(--serif);width:35px;height:35px;border-radius:50%;font-size:15px}
.sidebar-bottom strong{font-size:11px;font-weight:500;display:block}
.sidebar-bottom small{font-size:9px;color:#a1a497;display:block;margin-top:2px}
.tiny-heart{margin-left:auto;color:#a3ab98}
.tiny-heart svg{width:13px;height:13px}
.app-shell{margin-left:228px;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:72px;min-height:72px;border-bottom:1px solid var(--line);padding:0 39px;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.4)}
.topbar-breadcrumb,.topbar-right{display:flex;align-items:center;gap:13px;color:var(--muted);font-size:11px}
.topbar-breadcrumb svg{width:15px;height:15px;color:#9da38e}
.topbar-breadcrumb strong{font-weight:400;color:#59624e}
.slash{color:#cccfc3;margin:0 2px}
.topbar-right{gap:23px}
.serving-label{display:flex;gap:6px;align-items:center}
.serving-label svg{width:14px;height:14px}
.season-control{display:flex;gap:7px;align-items:center;padding:7px 11px;border:1px solid #e4e7db;border-radius:6px;background:#fffefa;color:#6e7b5d;font-size:11px}
.season-control svg{width:13px;height:13px}
main{width:100%;max-width:1220px;padding:35px 39px 25px;margin:0 auto;flex:1}
main:focus{outline:0}
.page-heading{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:26px}
.page-heading h1{font-family:var(--serif);font-size:32px;letter-spacing:1.6px;font-weight:600;line-height:1.5;margin:0 0 7px}
.page-heading p{color:var(--muted);font-size:12px;margin:0;letter-spacing:.4px}
.eyebrow{font-size:9px;letter-spacing:2px;color:#9da28f;text-transform:uppercase;margin:0 0 7px}
.heading-actions{display:flex;gap:10px;align-items:center;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:7px;min-height:39px;padding:9px 15px;font-size:12px;line-height:1.5;transition:all .18s;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--green);color:#fff;box-shadow:0 3px 7px #526a4212;border:1px solid var(--green)}
.btn.primary:hover{background:#445a35;border-color:#445a35;transform:translateY(-1px)}
.btn.secondary{background:#fffefa;border:1px solid #dedfd3;color:#636b58}
.btn.secondary:hover{border-color:#9dab8a;background:#f5f6ed}
.btn.ghost{color:#6e7d5d;padding-left:8px;padding-right:8px}
.btn.ghost:hover{background:#eef1e6}
.btn.small{min-height:30px;padding:5px 10px;font-size:11px}
.date-row{display:flex;gap:15px;align-items:center;justify-content:space-between;margin:0 0 27px;border-bottom:1px solid var(--line);padding-bottom:0}
.day-tabs{display:flex;align-items:stretch;gap:5px;min-width:0}
.day-tab{padding:9px 16px 15px;display:flex;gap:7px;align-items:center;position:relative;color:#999c91;font-size:11px;white-space:nowrap}
.day-tab strong{font-weight:400;font-size:11px}
.day-tab.active{color:var(--green);font-weight:600}
.day-tab.active:after{content:'';position:absolute;left:15px;right:15px;bottom:-1px;height:2px;background:var(--green);border-radius:2px}
.day-tab.active strong{font-weight:500}
.day-tab:hover{color:var(--green)}
.date-select{display:flex;gap:7px;align-items:center;white-space:nowrap;color:#949a87;font-size:10px;padding-bottom:8px}
.date-select input{width:118px;background:transparent;border:0;color:#7b836d;font-size:10px;cursor:pointer}
.date-select svg{width:13px;height:13px}
.nutrition-panel{border:1px solid var(--line);background:#fffefa;border-radius:10px;padding:17px 21px 19px;margin-bottom:31px}
.nutrition-title{display:flex;align-items:center;gap:8px;margin-bottom:15px;font-size:11px;font-weight:600;color:#68735b}
.nutrition-title>span:last-child{margin-left:auto;color:#9ca58d;font-size:10px;font-weight:400;display:flex;gap:4px;align-items:center}
.nutrition-title svg{width:13px;height:13px}
.nutrition-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.nutrient{display:flex;align-items:center;gap:11px;padding:0 20px;border-left:1px solid #ecece3}
.nutrient:first-child{padding-left:0;border-left:0}
.nutrient:last-child{padding-right:0}
.nutrient-icon{width:37px;height:37px;display:grid;place-items:center;flex:none;background:#edf1e7;border-radius:10px;color:#8a9f71}
.nutrient-icon svg{width:19px;height:19px;stroke-width:1.5}
.nutrient.carbs .nutrient-icon{background:#fbf0df;color:#c3a36b}
.nutrient.fat .nutrient-icon{background:#f7ece7;color:#c29279}
.nutrient.oats .nutrient-icon{background:#f0eee3;color:#aca076}
.nutrient-copy{min-width:0;flex:1}
.nutrient-copy>span,.nutrient-label{font-size:10px;color:#929788}
.nutrient-value{display:flex;align-items:baseline;gap:3px;line-height:1.4;margin:2px 0 5px}
.nutrient-value strong{font-family:Arial,sans-serif;font-size:23px;font-weight:500;letter-spacing:-.7px;color:#4c5842}
.nutrient-value span{font-size:10px;color:#949b89}
.nutrient-target{font-size:9px;color:#9fa48f;white-space:nowrap}
.progress{height:3px;background:#edf0e4;border-radius:3px;overflow:hidden;margin-bottom:4px;max-width:125px}
.progress>i{display:block;height:100%;border-radius:3px;background:#8da375;max-width:100%}
.carbs .progress>i{background:#c7ad7b}.fat .progress>i{background:#cfaa91}.oats .progress>i{background:#b4ad8c}
.section-heading{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px;gap:16px}
.section-heading h2{font-family:var(--serif);font-size:20px;font-weight:600;margin:0;letter-spacing:1px}
.section-heading p{color:#a1a594;font-size:10px;margin:3px 0 0}
.section-note{display:flex;gap:5px;align-items:center;font-size:10px;color:#929c81;white-space:nowrap}
.section-note svg{width:13px;height:13px}
.meal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:21px}
.meal-card{background:#fffefa;border:1px solid var(--line);border-radius:11px;overflow:hidden;transition:box-shadow .22s,transform .22s}
.meal-card:hover{box-shadow:0 6px 20px #4e5c3d0a;transform:translateY(-1px)}
.food-image{background-repeat:no-repeat;background-color:#e9e7dd;position:relative}
.meal-photo{height:215px;position:relative;background-size:300% 300%;isolation:isolate;cursor:pointer}
.meal-photo:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#302d2512,transparent 40%,#322f2510);z-index:-1}
.photo-top{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;position:relative}
.meal-label{display:inline-flex;gap:6px;align-items:center;background:#fffef8ed;border-radius:5px;padding:4px 9px;font-size:11px;color:#656f54;backdrop-filter:blur(6px)}
.meal-label svg{width:13px;height:13px}
.meal-time{font-size:10px;letter-spacing:.3px;color:#fff;background:#3a442c52;padding:4px 8px;border-radius:5px;backdrop-filter:blur(3px)}
.favorite-btn{position:absolute;right:15px;bottom:14px;display:grid;place-items:center;width:31px;height:31px;border-radius:50%;background:#fffef6e8;color:#9ca18f;transition:all .2s}
.favorite-btn svg{width:15px;height:15px}
.favorite-btn:hover{background:#fff;transform:scale(1.07);color:#8a9c75}
.favorite-btn.saved{color:#8e674f;background:#fff6ed}
.favorite-btn.saved svg{fill:#ead5c6}
.meal-content{padding:17px 19px 0}
.meal-heading{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.meal-heading h3{margin:0;font-family:var(--serif);font-size:20px;line-height:1.5;font-weight:600;letter-spacing:.6px}
.recipe-link{font-size:10px;color:#9ba48b;display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.recipe-link svg{width:12px;height:12px}
.recipe-link:hover{color:var(--green)}
.dish-line{font-size:12px;color:#7d876f;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;line-height:1.8}
.dish-line button{font-size:10px;color:#a2aa95;padding:0}
.dish-line svg{width:12px;height:12px}
.tag-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:9px 0 13px}
.tag{font-size:9px;display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:4px;line-height:1.7;white-space:nowrap}
.tag svg{width:10px;height:10px}
.tag.green{background:#edf2e7;color:#8b9b75}.tag.orange{background:#fbf0e5;color:#b59673}.tag.neutral{background:#f3f3ec;color:#a1a58f}
.staple-line{border-top:1px dashed #e8e8df;display:flex;align-items:center;gap:7px;padding:12px 0 11px;font-size:11px;color:#9da38e;line-height:1.6}
.staple-line svg{color:#a3ad8d;width:15px;height:15px}
.staple-line strong{font-weight:400;color:#788568}
.staple-line>span:last-child{margin-left:auto;font-size:10px}
.meal-card-footer{border-top:1px solid #efefe7;display:flex;align-items:center;justify-content:space-between;padding:11px 0 12px;gap:6px}
.macro-inline{display:flex;gap:11px;color:#a0a590;font-size:9px;flex-wrap:wrap;line-height:1.6}
.macro-inline strong{font-weight:400;color:#838d75}
.swap-button{display:flex;gap:5px;align-items:center;font-size:10px;color:#7a8c64;white-space:nowrap;padding:3px 0 3px 7px}
.swap-button svg{width:12px;height:12px}
.swap-button:hover{color:#3e5730}
.secondary-meals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:21px;margin-top:20px}
.compact-card{background:#fffefa;border:1px solid var(--line);border-radius:9px;display:flex;overflow:hidden;min-height:164px}
.compact-photo{width:138px;min-width:138px;position:relative;cursor:pointer;background-size:300% 300%}
.compact-photo .meal-label{position:absolute;left:9px;top:9px;font-size:9px;padding:3px 6px}
.compact-body{padding:14px 15px 11px;display:flex;flex-direction:column;flex:1;min-width:0}
.compact-top{display:flex;justify-content:space-between;align-items:center;font-size:9px;color:#a3a993;margin-bottom:5px;gap:5px}
.compact-title{font-family:var(--serif);font-size:15px;line-height:1.6;font-weight:600;margin:0 0 5px;letter-spacing:.3px}
.compact-description{font-size:10px;color:#979e8a;line-height:1.9;margin:0 0 6px}
.compact-description strong{font-weight:400;color:#7e8c6d}
.compact-bottom{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:9px;color:#a2a990;line-height:1.5}
.compact-bottom .swap-button{font-size:9px}
.compact-bottom svg{width:11px;height:11px}
.gentle-note,.oat-note{border-radius:7px;background:#eff2e8;color:#8b9779;padding:13px 15px;font-size:10px;display:flex;gap:9px;align-items:flex-start;margin-top:20px;line-height:1.9}
.gentle-note svg,.oat-note svg{width:16px;height:16px;margin-top:1px;color:#9ba88a}
.gentle-note strong,.oat-note strong{font-weight:500;color:#7b8967}
.page-note{font-size:9px;color:#a8ad9d;line-height:1.9;margin:17px 0 0}
footer{border-top:1px solid var(--line);margin:9px 39px 0;padding:18px 0 20px;display:flex;align-items:center;gap:7px;font-size:10px;color:#a1a78f;letter-spacing:.3px}
.footer-brand svg{width:15px;height:15px;color:#96a27d}
.footer-meta{margin-left:auto;font-size:9px;color:#b0b3a7}
.shopping-layout{display:grid;grid-template-columns:1fr 270px;gap:24px;align-items:start}
.shopping-summary{background:#eef2e7;padding:23px;border-radius:9px;position:sticky;top:24px;color:#7f8b6d}
.shopping-summary h3{font-family:var(--serif);font-size:18px;color:#5e7250;font-weight:500;margin:0 0 13px}
.shopping-summary p{font-size:12px;line-height:1.9}
.shopping-summary strong{color:#5e7250;font-weight:500}
.shopping-summary .progress{height:5px;max-width:none;margin:14px 0 7px;background:#e0e6d6}
.shopping-progress{font-size:11px;display:flex;justify-content:space-between;color:#879576;margin-bottom:16px}
.shopping-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:19px;align-items:center}
.shopping-group{margin-bottom:23px;break-inside:avoid}
.shopping-group h3{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;color:#74845f;margin:0 0 10px}
.shopping-group h3 svg{width:16px;height:16px}
.shopping-group h3>span:last-child{font-size:10px;color:#a8af9b;font-weight:400}
.shopping-items{background:#fffefa;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.shopping-item{border-bottom:1px solid #efefe6;transition:background .2s}
.shopping-item:last-child{border:0}
.shopping-item label{display:flex;align-items:center;gap:12px;cursor:pointer;padding:13px 16px;font-size:13px;color:#707d60}
.shopping-item input{accent-color:var(--green);width:16px;height:16px;margin:0;flex:none;cursor:pointer}
.shopping-item .amount{margin-left:auto;color:#9fa78e;font-size:12px;white-space:nowrap}
.shopping-item.checked{background:#f7f8f1}
.shopping-item.checked label>span:not(.amount){text-decoration:line-through;color:#b1b7a5}
.shopping-item.checked .amount{color:#bbc0b1}
.empty-state{text-align:center;background:#fffefa;border:1px dashed #dce0d2;border-radius:10px;padding:66px 20px 60px;color:#a3aa95}
.empty-state>svg{width:39px;height:39px;stroke-width:1.15;margin-bottom:15px;color:#b4bea1}
.empty-state h2{font-family:var(--serif);font-size:22px;color:#758665;font-weight:500;margin:0 0 9px}
.empty-state p{font-size:12px;line-height:1.9;margin:0 0 20px}
.favorites-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.favorite-card{background:#fffefa;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.favorite-card .food-image{height:170px;background-size:300% 300%;cursor:pointer}
.favorite-card .meal-content{padding:14px 15px 0}
.favorite-card h3{font-size:16px;font-family:var(--serif);font-weight:500;margin:0 0 5px}
.favorite-card p{font-size:10px;color:#9ca58d;margin:0 0 13px}
.favorite-card .meal-card-footer{font-size:10px}
.guide-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.guide-card{background:#fffefa;border:1px solid var(--line);border-radius:9px;padding:25px 26px}
.guide-number{font-size:11px;letter-spacing:2px;color:#aab49a;display:block;margin-bottom:17px}
.guide-card h2{font-family:var(--serif);font-size:20px;font-weight:500;margin:0 0 12px;color:#657b52}
.guide-card p,.guide-card li{font-size:12px;line-height:2;color:#919b82}
.guide-card p:last-child{margin-bottom:0}
.guide-card ul{padding-left:18px}
.guide-card strong{font-weight:500;color:#6e805c}
.modal{width:min(720px,calc(100vw - 32px));max-height:90vh;padding:0;border:1px solid #e6e7dc;border-radius:14px;background:#fffefa;color:var(--ink);box-shadow:0 20px 80px #29322426;overflow:auto;overscroll-behavior:contain}
.modal::backdrop{background:#29302266;backdrop-filter:blur(3px)}
.modal-header{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:22px 27px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fffefa;z-index:2}
.modal-header h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0;color:#4f6341}
.modal-header p{font-size:10px;color:#99a08e;margin:5px 0 0}
.close-button{display:grid;place-items:center;width:31px;height:31px;flex:none;border-radius:50%;background:#f1f2e9;color:#8d997a}
.close-button:hover{background:#e8ecdd}
.close-button svg{width:17px;height:17px}
.modal-photo{height:265px;background-size:300% 300%;position:relative}
.modal-photo>span{position:absolute;right:12px;bottom:10px;color:#838b75;background:#fffefaDE;padding:3px 8px;border-radius:4px;font-size:9px}
.modal-content{padding:23px 28px 28px}
.modal-content>h3{font-family:var(--serif);font-size:19px;font-weight:500;color:#6e815c;margin:0 0 14px}
.modal-content>p{font-size:12px;line-height:1.9;color:#909b80}
.recipe-sections{display:grid;grid-template-columns:180px 1fr;gap:27px;margin-top:20px}
.recipe-sections h3{font-size:13px;font-weight:500;color:#6a7b57;margin:0 0 12px}
.ingredient-list{margin:0;padding:0;list-style:none;font-size:11px;color:#8f9c7e}
.ingredient-list li{display:flex;gap:6px;justify-content:space-between;border-bottom:1px dashed #e7eadf;padding:7px 0}
.ingredient-list li span:last-child{color:#a4ad96;white-space:nowrap}
.recipe-steps{list-style:none;counter-reset:step;padding:0;margin:0;display:grid;gap:14px}
.recipe-steps li{counter-increment:step;display:flex;gap:10px;font-size:12px;line-height:1.9;color:#8e9b7b}
.recipe-steps li:before{content:counter(step);display:grid;place-items:center;background:#eef2e6;color:#82936e;min-width:22px;height:22px;border-radius:50%;font-family:Arial,sans-serif;font-size:10px;margin-top:1px}
.recipe-tip{padding:12px 14px;background:#f2f4ea;border-radius:6px;color:#94a180;font-size:11px;line-height:1.9;margin:23px 0 0}
.recipe-tip strong{font-weight:500;color:#7c8c67}
.modal-actions{padding-top:22px;display:flex;gap:10px;justify-content:flex-end}
.season-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:20px 0}
.season-option{border:1px solid var(--line);border-radius:8px;padding:20px;text-align:left;background:#fffefa;color:#929e81;display:flex;flex-direction:column;gap:5px}
.season-option strong{font-family:var(--serif);font-weight:500;font-size:20px;color:#728462}
.season-option small{font-size:11px;color:#a0aa91}
.season-option.selected{border-color:#96a580;background:#f1f4e8;box-shadow:inset 0 0 0 1px #96a580}
.season-option:hover{border-color:#a2b18d;background:#f5f7ef}
.serving-note{color:#a1aa92;font-size:11px;line-height:1.9;margin:14px 0}
.toast{position:fixed;bottom:30px;left:calc(50% + 114px);transform:translate(-50%,12px);padding:11px 22px;border-radius:7px;background:#435536ed;color:#fffbed;font-size:12px;box-shadow:0 4px 20px #35432a14;opacity:0;pointer-events:none;z-index:99;transition:opacity .22s,transform .22s;max-width:calc(100vw - 40px);text-align:center}
.toast.visible{opacity:1;transform:translate(-50%,0)}

/* Recipe and shopping layouts follow the generated meal content. */
.meal-photo>.food-image{position:absolute;inset:0;width:100%;height:100%}
.photo-detail{position:absolute;inset:0;z-index:1;width:100%;height:100%;padding:0;border:0;border-radius:0;background:transparent}
.photo-detail:focus-visible{outline-offset:-5px}
.photo-top{z-index:2;pointer-events:none}
.favorite-btn{z-index:3}
.title-button{font:inherit;color:inherit;padding:0;text-align:left;line-height:inherit}
.title-button:hover{color:var(--green)}
.dish-line>span{flex:1}
.dish-line>.icon{width:13px;height:13px;color:#a4af90}
.staple-line small{margin-left:auto;color:#a1aa92;font-size:9px}
.macro-inline i,.compact-bottom i{font-style:normal;color:#c3c8b8}
.compact-body>h3{font-family:var(--serif);font-size:15px;font-weight:500;line-height:1.7;margin:0 0 4px;color:#6c7b5c}
.compact-top .compact-title{font-family:var(--sans);font-size:10px;color:#7b8b68;font-weight:500;margin:0}
.compact-time{font-size:8px;color:#a7af9a;white-space:nowrap}
.small-leaf{display:inline-flex;margin-left:8px;vertical-align:middle;color:#a7b197;transform:rotate(12deg)}
.small-leaf svg{width:18px;height:18px;stroke-width:1.3}
.section-heading p>span{margin:0 5px;color:#c4c9b8}
.gentle-note p{font-size:inherit;line-height:1.9;margin:3px 0 0}
.gentle-note .note-check{margin-left:auto;display:flex;gap:4px;white-space:nowrap;font-size:9px;align-items:center;padding-top:3px;color:#94a47d}
.gentle-note .note-check svg{width:13px;height:13px;margin:0}
.page-note>.icon{width:11px;height:11px;margin-right:4px;vertical-align:-2px}
.shopping-summary{position:static;display:flex;align-items:center;gap:20px;padding:18px 22px;margin-bottom:23px}
.shopping-summary>div:first-child{display:flex;align-items:center;gap:14px;white-space:nowrap}
.shopping-summary>div:first-child strong{font-family:Arial,sans-serif;font-size:26px;font-weight:400;color:#6a7f54;line-height:1.3}
.shopping-summary>div:first-child strong span{font-size:15px;color:#a4af96}
.shopping-summary>div:first-child>span{font-size:11px;color:#99a78a}
.shopping-progress{height:5px;background:#dde5d1;flex:1;border-radius:4px;overflow:hidden;margin:0}
.shopping-progress>i{display:block;background:#91a778;height:100%;border-radius:4px}
.shopping-layout{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 22px}
label.shopping-item{display:flex;align-items:center;gap:12px;cursor:pointer;padding:13px 16px;font-size:13px;color:#707d60}
.shopping-item>span:nth-child(2){flex:1}
.recipe-sections{display:block;margin-top:23px}
.recipe-section{margin:0 0 27px}
.recipe-section:last-child{margin-bottom:0}
.recipe-section>h3{font-family:var(--serif);font-size:17px;font-weight:500;color:#637c50;padding-bottom:9px;border-bottom:1px solid #e8ebde;margin:0 0 11px}
.ingredient-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 23px;margin:0 0 17px;font-size:11px;color:#8f9c7e}
.ingredient-list>span{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #e8ebdf;padding:6px 0}
.ingredient-list strong{font-weight:400;color:#a6af98;white-space:nowrap}
.recipe-steps{gap:11px}
.recipe-tip>.icon{width:13px;height:13px;margin-right:6px}
.modal-actions{justify-content:space-between;align-items:center;gap:15px}
.modal-actions>span{font-size:10px;color:#a2ac92;line-height:1.8}
.guide-number{display:flex;align-items:center;justify-content:space-between}
.guide-number>.icon{width:25px;height:25px;stroke-width:1.2;color:#a1b28c}
.copy-text{width:100%;min-height:330px;resize:vertical;background:#f7f8f0;border:1px solid #e2e7d8;border-radius:6px;padding:15px;color:#7d8c6a;font:12px/2 var(--sans)}
.food-crop{display:block;width:100%;height:100%}
.swap-dish{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;color:#9ba98a}
.swap-dish:hover{background:#f0f3e8;color:#647f4c}
.note-symbol{display:inline-flex;flex:none;padding-top:1px}
.page-heading h1{font-size:36px}
.page-heading p,.btn,.topbar-breadcrumb,.season-control{font-size:12px}
.eyebrow{font-size:10px}
.day-tab,.day-tab strong{font-size:12px}
.date-select input,.date-select{font-size:11px}
.nutrition-title{font-size:12px}
.nutrition-title>span:last-child,.nutrition-title small{font-size:11px}
.nutrient-copy>span,.nutrient-label{font-size:11px}
.nutrient-target{font-size:10px}
.nutrient-value span{font-size:11px}
.section-heading p,.section-note{font-size:11px}
.meal-label,.meal-time,.recipe-link{font-size:11px}
.dish-line{font-size:13px}
.tag{font-size:11px}
.staple-line{font-size:12px}
.staple-line small{font-size:11px}
.macro-inline,.swap-button{font-size:11px}
.compact-body>h3{font-size:16px}
.compact-top .compact-title{font-size:12px}
.compact-time{font-size:10px}
.compact-description,.compact-bottom,.compact-bottom .recipe-link{font-size:11px}
.gentle-note,.oat-note,.page-note{font-size:11px}
.gentle-note .note-check{font-size:10px}
.footer-meta,footer{font-size:10px}
.nav-caption{font-size:10px;letter-spacing:1px}
.sidebar-note small{font-size:11px;letter-spacing:0}
.sidebar-bottom strong{font-size:12px}
.sidebar-bottom small{font-size:10px}
.ingredient-list,.recipe-tip{font-size:12px}
.recipe-steps li{font-size:13px}
.modal-actions>span{font-size:11px}

const pick = (items, excluded = []) => {
  const pool = items.filter(item => !excluded.includes(item.id));
  // 候选少时优先避免第一个排除项：换菜时它是当前菜；配餐时它是另一餐的菜。
  const fallback = items.filter(item => item.id !== excluded[0]);
  const available = pool.length ? pool : fallback.length ? fallback : items;
  return clone(available[Math.floor(Math.random() * available.length)]);
};

      item.totals = roundedNutrition(sumIngredients(item.ingredients));
      if (item.kind === 'protein' || item.kind === 'vegetable') {
        item.serving = item.ingredients.filter(i => !['调味'].includes(i.group)).map(i => `${i.name}${i.g}克`).join('、');
      }
      if (item.kind === 'staple') {
        item.serving = item.ingredients.filter(i => i.g > 0).map(i => `${i.name}${i.g}克`).join(' + ') + '（干重）';
      }
    }
    meal.totals = roundedNutrition(sumIngredients(meal.items.flatMap(i => i.ingredients)));
    meal.oats = meal.items.flatMap(i => i.ingredients).filter(i => i.name === '燕麦米').reduce((s, i) => s + i.g, 0);
    meal.oil = meal.items.flatMap(i => i.ingredients).filter(i => i.name === '菜籽油').reduce((s, i) => s + i.g, 0);
  }
  const ingredients = allIngredients(plan);
  plan.totals = roundedNutrition(sumIngredients(ingredients));
  plan.oatsTotal = round(ingredients.filter(i => i.name === '燕麦米').reduce((sum, i) => sum + i.g, 0));
  plan.oilTotal = round(ingredients.filter(i => i.name === '菜籽油').reduce((sum, i) => sum + i.g, 0));
  plan.leafyTotal = round(ingredients.filter(i => i.group === '绿叶菜').reduce((sum, i) => sum + i.g, 0));

  plan.withinTargets = plan.totals.fat <= 40 && plan.totals.carbs >= 140 && plan.totals.carbs <= 160 && plan.totals.protein >= 65 && plan.totals.protein <= 80 && plan.oatsTotal === 75 && plan.leafyTotal >= 200;
  return plan;
}

/* 调整的是菜单里的实际份量，营养值仍逐项相加；不覆盖加总结果。 */
function balancePlan(plan) {
  for (const slot of ['lunch', 'dinner']) {
    plan[slot].protein = clone(recipes.find(r => r.id === plan[slot].protein.id));
    plan[slot].staple = makeStaple(slot === 'lunch' && plan.breakfastType === 'B' ? 50 : 25);
  }
  const variables = ['lunch', 'dinner'].flatMap(slot => plan[slot].protein.ingredients.filter(i => i.role === 'protein'));
  const variableTotal = sumIngredients(variables);
  const initial = sumIngredients(allIngredients(plan));
  const baseP = initial.protein - variableTotal.protein;
  const baseC = initial.carbs - variableTotal.carbs;
  const riceP = INGREDIENTS['大米'].protein / 100;
  const riceC = INGREDIENTS['大米'].carbs / 100;
  let scale = ((70 - baseP) - riceP / riceC * (150 - baseC)) / (variableTotal.protein - riceP / riceC * variableTotal.carbs);
  let rice = (150 - baseC - variableTotal.carbs * scale) / riceC;
  // 水果、玉米等已覆盖碳水时，不再加大米，并适量缩小B早餐的其他主食。
  // 燕麦米的75克干重始终固定；联立食物实际份量，避免稀有组合超过160克碳水。
  if (rice < 0 && plan.breakfastType === 'B') {
    rice = 0;
    const starch = plan.breakfast.staple.ingredients[0];
    const starchTotal = sumIngredients([starch]);
    const fixedP = baseP - starchTotal.protein;
    const fixedC = baseC - starchTotal.carbs;
    const starchScale = ((150 - fixedC) - variableTotal.carbs / variableTotal.protein * (70 - fixedP)) /
      (starchTotal.carbs - variableTotal.carbs / variableTotal.protein * starchTotal.protein);
    if (starchScale <= 0 || starchScale > 1.01) throw new Error('早餐主食份量无法匹配，请重新生成。');
    scale = (70 - fixedP - starchTotal.protein * starchScale) / variableTotal.protein;
    starch.g = Math.round(starch.g * starchScale);
    plan.breakfast.staple.serving = `${starch.g}克可食部`;
  } else if (rice < 0) { rice = 0; scale = (70 - baseP) / variableTotal.protein; }
  if (!Number.isFinite(scale) || scale < 0.35 || scale > 2.0) throw new Error('菜单份量无法合理匹配营养目标，请重新生成。');
  for (const ingredient of variables) ingredient.g = Math.round(ingredient.g * scale);
  const totalRice = Math.round(rice);
  const lunchRice = Math.round(totalRice * 0.6);
  plan.lunch.staple.ingredients[1].g = lunchRice;
  plan.dinner.staple.ingredients[1].g = totalRice - lunchRice;
  recalcPlan(plan);
  if (!plan.withinTargets) throw new Error('菜单未满足设定目标，请重新生成。');
  return plan;
}

function createPlan({ date = localDateString(), season = getSeason(date), breakfastType = getBreakfastType(date), previous = null } = {}) {
  if (!ALL.includes(season)) season = getSeason(date);
  if (!['A', 'B'].includes(breakfastType)) breakfastType = getBreakfastType(date);
  const proteins = recipes.filter(r => r.kind === 'protein' && r.seasons.includes(season));
  const vegetables = recipes.filter(r => r.kind === 'vegetable' && r.seasons.includes(season));
  const lunchProtein = pick(proteins, previous ? [previous.lunch.protein.id] : []);
  const dinnerProtein = pick(proteins, [lunchProtein.id, ...(previous ? [previous.dinner.protein.id] : [])]);
  const lunchVegetable = pick(vegetables.filter(r => r.green), previous ? [previous.lunch.vegetable.id] : []);
  const dinnerVegetable = pick(vegetables, [lunchVegetable.id, ...(previous ? [previous.dinner.vegetable.id] : [])]);
  const breakfast = makeBreakfast(breakfastType, season);
  const snackFruit = fruitItem(pick(fruits.filter(f => f.seasons.includes(season)), [breakfast.fruit.id]), 150);
  return balancePlan({
    version: 1, date, season, breakfastType, breakfast,
    lunch: makeMeal('lunch', lunchProtein, lunchVegetable, breakfastType === 'A' ? 25 : 50),
    dinner: makeMeal('dinner', dinnerProtein, dinnerVegetable, 25),
    snack: { id: 'snack', title: '下午加餐', name: '当季水果小歇', time: '15:30', imageKey: 'fruit', fruit: snackFruit, items: [snackFruit], tip: '一份完整水果，留一点清甜给下午。' }
  });
}

function swapMeal(original, slot) {
  const plan = clone(original);
  if (slot === 'breakfast') {
    plan.breakfast = makeBreakfast(plan.breakfastType, plan.season, plan.breakfast);
  } else if (slot === 'snack') {
    plan.snack.fruit = fruitItem(pick(fruits.filter(f => f.seasons.includes(plan.season)), [plan.snack.fruit.id, plan.breakfast.fruit.id]), 150);
  } else if (slot === 'lunch' || slot === 'dinner') {
    const other = slot === 'lunch' ? 'dinner' : 'lunch';
    const pool = recipes.filter(r => r.seasons.includes(plan.season));
    plan[slot].protein = pick(pool.filter(r => r.kind === 'protein'), [plan[slot].protein.id, plan[other].protein.id]);
    const needsGreen = !plan[other].vegetable.green;
    plan[slot].vegetable = pick(pool.filter(r => r.kind === 'vegetable' && (!needsGreen || r.green)), [plan[slot].vegetable.id, plan[other].vegetable.id]);
  } else throw new Error('未知餐次');
  return balancePlan(plan);
}

function swapDish(original, slot, type) {
  if (!['lunch', 'dinner'].includes(slot) || !['protein', 'vegetable'].includes(type)) throw new Error('请选择午餐或晚餐的荤菜、素菜');
  const plan = clone(original);
  const other = slot === 'lunch' ? 'dinner' : 'lunch';
  const needsGreen = type === 'vegetable' && !plan[other].vegetable.green;
  const pool = recipes.filter(r => r.kind === type && r.seasons.includes(plan.season) && (!needsGreen || r.green));
  plan[slot][type] = pick(pool, [plan[slot][type].id, plan[other][type].id]);
  return balancePlan(plan);
}

function getShoppingList(plan) {
  const map = new Map();
  for (const slot of MEALS) {
    for (const item of itemsOf(plan[slot])) {
      for (const ingredient of item.ingredients) {
        if (!ingredient.g) continue;
        const key = `${ingredient.name}|${ingredient.unit || 'g'}`;
        if (!map.has(key)) map.set(key, { ...clone(ingredient), g: 0, meals: [] });
        const row = map.get(key);
        row.g = round(row.g + ingredient.g);
        row.amount = row.g;
        row.unit = ingredient.unit || 'g';
        if (!row.meals.includes(plan[slot].title)) row.meals.push(plan[slot].title);
      }
    }
  }
  const order = ['优质蛋白', '绿叶菜', '蔬菜', '水果', '主食', '乳品', '坚果', '调味', '饮品'];
  return [...map.values()].sort((a, b) => order.indexOf(a.group) - order.indexOf(b.group));
}

return {recipes, createPlan, swapMeal, swapDish, getShoppingList, getSeason};

function compactCard(slot){const meal=plan[slot];const breakfast=slot==='breakfast';const items=meal.items||[];const names=items.map(i=>i.name||i.title).filter(Boolean);return `<article class="compact-card">${photo(breakfast?`breakfast${plan.breakfastType}`:meal.fruit?.id||'fruit','compact-photo',breakfast?'固定早餐':meal.fruit?.name||'时令水果')}<div class="compact-body"><div class="compact-top"><span class="compact-title">${breakfast?'早餐':'下午加餐'}</span><span class="compact-time">${breakfast?'07:30 — 08:30':'15:00 — 16:00'}</span></div><h3>${breakfast?(plan.breakfastType==='A'?'酸奶燕麦早餐':'牛奶轻盈早餐'):(names.join(' · ')||'一份时令水果')}</h3><p class="compact-description">${escape(breakfast?names.join(' + '):fruitDescription(meal))}</p><div class="compact-bottom"><span>${Math.round(meal.totals.kcal)} kcal <i>·</i> ${breakfast?`早餐 ${plan.breakfastType} 方案`:'优先吃完整鲜果'}</span><button class="recipe-link" ${breakfast?'data-detail="breakfast"':'data-swap="snack"'}>${breakfast?'查看份量':'换一种'} ${icon(breakfast?'arrow':'refresh')}</button></div></div></article>`;}
function fruitDescription(meal){return (meal.items||[]).flatMap(i=>i.ingredients||[]).map(i=>`${i.name} ${i.g}g`).join(' · ')+'，洗净切块即可。';}
function renderToday(){main.innerHTML=heading('今天吃什么？','不必为吃什么费心，把每一餐安排得刚刚好。',`<button class="btn secondary" data-view="shopping">${icon('basket')}备菜清单</button><button class="btn primary" id="random-all">${icon('shuffle')}换个搭配</button>`)+renderDates()+renderNutrients()+`<div class="section-heading"><div><h2>一日三餐，好好吃饭<span class="small-leaf">${icon('sprout')}</span></h2><p>${dateLabel(selectedDate)} <span>·</span> ${seasonCopy[season()]}</p></div><span class="section-note">${icon('leaf')} 应季食材，荤素搭配</span></div><section class="meal-grid" aria-label="午餐与晚餐">${mealCard('lunch')}${mealCard('dinner')}</section><section class="secondary-meals" aria-label="早餐与下午加餐">${compactCard('breakfast')}${compactCard('snack')}</section><div class="gentle-note"><span class="note-symbol">${icon('grain')}</span><div><strong>每日 75g 燕麦米，今天也安排好了</strong><p>${plan.breakfastType==='A'?'早餐 25g + 午餐 25g + 晚餐 25g':'早餐用其他主食，午餐 50g + 晚餐 25g'}。均为干重，煮熟后的重量会因加水量不同而变化。</p></div><span class="note-check">${icon('check')} 已满足</span></div><p class="page-note">${icon('info')} 营养按食材生重估算，含烹调油和坚果；今日用油 ${plan.oilTotal}g。低胆固醇鸡蛋默认按 2 个蛋白计算。换菜后，请以最新份量和清单为准。</p>`;}
function getCheckKey(item){return `${selectedDate}:${item.name}`;}
function renderShopping(){const items=shoppingItems();const groups={};items.forEach(i=>(groups[i.group||'其他食材']||=[]).push(i));const done=items.filter(i=>checked[getCheckKey(i)]).length;main.innerHTML=heading('今天，买这些就够了。',`${dateLabel(selectedDate)} · 一人份备菜清单，已合并重复食材。`,`<button class="btn secondary" id="copy-list">${icon('copy')}复制清单</button><button class="btn primary" id="print-list">${icon('printer')}打印清单</button>`,'KITCHEN NOTES · 有备而来')+`<div class="shopping-summary"><div><strong>${done}<span> / ${items.length}</span></strong><span>项食材已备好</span></div><div class="shopping-progress"><i style="width:${items.length?done/items.length*100:0}%"></i></div><button class="btn ghost small" id="clear-checks">重置勾选</button></div><div class="shopping-layout">${Object.entries(groups).map(([group,list])=>`<section class="shopping-group"><h3>${icon(group==='蔬菜'?'leaf':group==='优质蛋白'?'protein':'basket')}${escape(group)}<span>${list.length} 项</span></h3><div class="shopping-items">${list.map(i=>`<label class="shopping-item ${checked[getCheckKey(i)]?'checked':''}"><input type="checkbox" data-ingredient="${escape(i.name)}" ${checked[getCheckKey(i)]?'checked':''}/><span>${escape(i.name)}</span><span class="amount">${round(i.g)} ${i.unit||'g'}</span></label>`).join('')}</div></section>`).join('')}</div><div class="gentle-note">${icon('info')}<div><strong>份量按一人份食材生重计算</strong><p>蔬果为可食部，买菜时可适当预留去皮、去骨损耗。燕麦米与大米均按下锅前干重称量。</p></div></div><button class="btn secondary" data-view="today">${icon('calendar')}返回今日菜单</button>`;}
function recipeArray(){return Array.isArray(recipes)?recipes:Object.values(recipes);}
function renderFavorites(){const saved=recipeArray().filter(r=>favorites.includes(r.id));main.innerHTML=heading('把喜欢的，留在餐桌上。','收藏爱吃的家常菜，给下次备菜多一点灵感。','','FAMILY FAVORITES · 家常味道')+(saved.length?`<div class="favorites-grid">${saved.map(r=>`<article class="favorite-card"><div class="meal-photo">${photo(r.imageKey,'',r.name)}${favoriteButton(r)}<button class="photo-detail" data-recipe="${r.id}" aria-label="查看${escape(r.name)}做法"></button></div><div class="meal-content"><h3><button class="title-button" data-recipe="${r.id}">${escape(r.name)}</button></h3><p>${icon('clock')} ${r.time} 分钟 <span>·</span> ${r.green?'绿叶蔬菜':'少油家常做法'}</p><button class="recipe-link" data-recipe="${r.id}">查看做法 ${icon('arrow')}</button></div></article>`).join('')}</div>`:`<div class="empty-state"><span>${icon('heart')}</span><h2>喜欢的菜，值得再做一次</h2><p>点一下菜品照片上的爱心，就能在这里找到它。</p><button class="btn primary" data-view="today">去看看今日菜单 ${icon('arrow')}</button></div>`);}
function renderGuide(){const cards=[['75g 燕麦米，先看干重','每天固定 75g 燕麦米。A 早餐日早中晚各 25g；B 早餐日午餐 50g、晚餐 25g。这里的燕麦饭使用燕麦米搭配大米煮制，称的是下锅前干重。','grain'],['少一点油，鲜味也足够','优先蒸、煮、焯拌和不粘锅少油煎炒。页面把食谱中的烹调油全部计入脂肪，坚果、奶和肉类自带的脂肪也一并计算。鱼香肉丝使用少油少糖做法。','drop'],['每天有绿叶菜，按季节吃','午晚餐至少安排一道绿叶菜，并从所选季节的蔬菜和水果中随机搭配。默认按中国温带常见上市季节，实际供应因地区而异，可点击右上角调整季节。','leaf'],['优质蛋白，换着吃','荤菜以鳕鱼、其他鱼、虾、去皮鸡胸、瘦猪肉和瘦牛肉为主，搭配豆腐及低脂乳制品。减少肥肉、加工肉和浓油酱汁。','protein'],['“低胆固醇鸡蛋”如何计算？','保留你的早餐习惯，默认使用 2 个蛋白（约 66g），因为不同“低胆固醇鸡蛋”商品的营养不同。若改用全蛋或特定品牌鸡蛋，应按包装重新核算，不能直接沿用本页结果。','sun'],['营养数字，是备菜的参考','按常见食材成分估算：脂肪不超过 40g、碳水约 150g、蛋白质约 70g。油已计入，盐和酱料也应少量使用。该组合总能量偏低，是否适合妈妈，需结合体重、活动量及医生或营养师建议。','info']];main.innerHTML=heading('家常饭，也可以吃得安心。','记住几个小习惯，让每天的饭菜更适合自己。','','EAT WELL · 日常的照顾')+`<div class="guide-grid">${cards.map(([title,body,ico],i)=>`<article class="guide-card"><div class="guide-number">${icon(ico)}<span>0${i+1}</span></div><h2>${title}</h2><p>${body}</p></article>`).join('')}</div>`;}
function openDialog(html){document.querySelector('#dialog-body').innerHTML=html;dialog.showModal();}
function dialogHeader(title,sub=''){return `<div class="modal-header"><div><span class="eyebrow">KITCHEN RECIPE · 妈妈的小厨房</span><h2>${escape(title)}</h2>${sub?`<p>${escape(sub)}</p>`:''}</div><button class="close-button" data-close aria-label="关闭弹窗">${icon('close')}</button></div>`;}
function recipeSection(r){return `<section class="recipe-section"><h3>${escape(r.name)}</h3><div class="ingredient-list">${(r.ingredients||[]).map(i=>`<span>${escape(i.name)}<strong>${i.g}${i.unit||'g'}</strong></span>`).join('')}</div>${r.steps?.length?`<ol class="recipe-steps">${r.steps.map(s=>`<li>${escape(s)}</li>`).join('')}</ol>`:''}${r.tip?`<p class="recipe-tip">${icon('leaf')}${escape(r.tip)}</p>`:''}</section>`;}
function openMeal(slot){const m=plan[slot];const breakfast=slot==='breakfast';const items=breakfast?m.items:[m.protein,m.vegetable,m.staple];openDialog(dialogHeader(breakfast?'早餐 · 份量与搭配':`${slot==='lunch'?'午餐':'晚餐'} · 今天这样做`,`${dateLabel(selectedDate)} · 一人份 · 食材生重`)+(breakfast?'':photo(m.protein.imageKey,'modal-photo',m.protein.name))+`<div class="modal-content"><div class="serving-note">${icon('info')} 燕麦米、大米为干重，其他食材为可食部生重；图片为 AI 菜品示意。</div><div class="recipe-sections">${items.filter(Boolean).map(recipeSection).join('')}</div>${breakfast?'<p class="recipe-tip">“低胆固醇鸡蛋”默认按 2 个蛋白计算。改用商品鸡蛋时请以包装营养标签重新核算；咖啡不加糖和奶精。</p>':''}<div class="modal-actions"><span>${Math.round(m.totals.kcal)} kcal · 蛋白质 ${round(m.totals.protein)}g · 碳水 ${round(m.totals.carbs)}g · 脂肪 ${round(m.totals.fat)}g</span><button class="btn primary small" data-close>记下了 ${icon('check')}</button></div></div>`);}
function openRecipe(id){const r=recipeArray().find(x=>x.id===id);if(!r)return;const actual=['lunch','dinner'].map(s=>plan[s]).find(m=>m.protein?.id===id||m.vegetable?.id===id);const recipe=actual?(actual.protein.id===id?actual.protein:actual.vegetable):r;openDialog(dialogHeader(r.name,'一人份参考 · 实际菜单会按每日营养目标调整份量')+photo(r.imageKey,'modal-photo',r.name)+`<div class="modal-content">${recipeSection(recipe)}<div class="modal-actions"><button class="btn secondary" data-save="${r.id}">${icon('heart')}${favorites.includes(r.id)?'取消收藏':'收藏这道菜'}</button><button class="btn primary" data-close>记下了</button></div></div>`);}
function openSeason(){openDialog(dialogHeader('跟着季节，吃一点新鲜。','按中国温带常见上市季节筛选蔬果，可根据当地供应手动调整。')+`<div class="modal-content"><div class="season-options">${Object.entries(seasonNames).map(([key,name])=>`<button class="season-option ${season()===key?'selected':''}" data-season="${key}">${icon('leaf')}<strong>${name}食单</strong><span>${{spring:'3 — 5 月',summer:'6 — 8 月',autumn:'9 — 11 月',winter:'12 — 2 月'}[key]}</span>${season()===key?icon('check'):''}</button>`).join('')}</div><button class="btn secondary" data-season="auto">${icon('calendar')}跟随菜单日期自动选择</button><p class="page-note">鱼肉、禽肉、蛋奶等按全年可获得食材处理；蔬果会随季节变化。</p></div>`);}
function setView(view){currentView=view;history.replaceState(null,'',`#${view}`);render();window.scrollTo({top:0,behavior:'smooth'});}
function changeMenu(slot){try{const previous=plan;plan=swapMeal(plan,slot);if(!plan)plan=previous;persist();render();toast(slot==='snack'?'已换一份时令水果':'新搭配已准备好，营养也重新算好了');}catch(err){console.error(err);toast('这组搭配暂时无法更换，请试试换个搭配');}}
document.addEventListener('click',async e=>{const b=e.target.closest('button,a[data-view]');if(!b)return;
 if(b.dataset.view){setView(b.dataset.view);return;}
 if(b.dataset.date){selectedDate=b.dataset.date;loadPlan();render();return;}
 if(b.id==='random-all'){plan=createPlan({date:selectedDate,season:season(),previous:plan});persist();render();toast('今天的餐桌，有新灵感了');return;}
 if(b.dataset.swap){changeMenu(b.dataset.swap);return;}
 if(b.dataset.swapDish){plan=swapDish(plan,b.dataset.swapDish,'vegetable');persist();render();toast('素菜已更换，营养已重新计算');return;}
 if(b.dataset.save){const id=b.dataset.save;const existed=favorites.includes(id);favorites=existed?favorites.filter(x=>x!==id):[...favorites,id];save('chifan-favorites',favorites);render();if(dialog.open){dialog.querySelectorAll('[data-save]').forEach(el=>{el.innerHTML=icon('heart')+(existed?'收藏这道菜':'取消收藏');});}toast(existed?'已取消收藏':'已收进我的收藏');return;}
 if(b.dataset.detail){openMeal(b.dataset.detail);return;}
 if(b.dataset.recipe){openRecipe(b.dataset.recipe);return;}
 if(b.hasAttribute('data-close')){dialog.close();return;}
 if(b.id==='season-button'){openSeason();return;}
 if(b.dataset.season){seasonOverride=b.dataset.season==='auto'?null:b.dataset.season;save('chifan-season',seasonOverride);loadPlan();dialog.close();render();toast('已按所选季节重新搭配');return;}
 if(b.id==='clear-checks'){shoppingItems().forEach(i=>delete checked[getCheckKey(i)]);save('chifan-shopping-checks',checked);render();return;}
 if(b.id==='print-list'){window.print();return;}
 if(b.id==='copy-list'){const text=`今天吃什么 · ${dateLabel(selectedDate)}\n一人份备菜清单（食材生重）\n\n`+shoppingItems().map(i=>`${checked[getCheckKey(i)]?'☑':'□'} ${i.name} ${round(i.g)}${i.unit||'g'}`).join('\n')+'\n\n燕麦米、大米为干重；蔬果为可食部。';try{await navigator.clipboard.writeText(text);toast('备菜清单已复制');}catch{openDialog(dialogHeader('复制备菜清单')+`<div class="modal-content"><textarea class="copy-text" readonly aria-label="可复制的备菜清单">${escape(text)}</textarea><p>长按或全选以上文字即可复制。</p></div>`);}return;}
});
document.addEventListener('change',e=>{if(e.target.id==='menu-date'&&e.target.value){selectedDate=e.target.value;loadPlan();render();}if(e.target.dataset.ingredient){checked[`${selectedDate}:${e.target.dataset.ingredient}`]=e.target.checked;save('chifan-shopping-checks',checked);render();}});
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
document.querySelector('.brand').addEventListener('click',e=>{e.preventDefault();setView('today');});
loadPlan();
currentView=['today','shopping','favorites','guide'].includes(location.hash.slice(1))?location.hash.slice(1):'today';
render();

</script>
</body>
</html>
